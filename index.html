<style>
  :root {

    --indigo-deep: #0A4A3A;

  @media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }

  .car-wrap { position: relative; }

  .sh-l { color: #7C8B83; } .sh-v { color: var(--ink); font-weight: 600; text-align: right; }
  .sh-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
  .sh-chip { font-size: 11px; padding: 4px 9px; border-radius: 99px; background: var(--paper-dim); color: var(--ink-soft); }

  .sh-votebar { height: 12px; border-radius: 99px; background: rgba(212,137,10,0.15); overflow: hidden; }
  .sh-votebar span { display: block; height: 100%; background: var(--indigo); border-radius: 99px; }
  .sh-votelabels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .shot-bar { align-items: center; }
  .shot-url { flex: 1; margin-left: 8px; background: var(--white); border: 1px solid var(--line); border-radius: 99px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7C8B83; padding: 4px 12px; }
  .shot-app { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--white); }

  .shot-caption { padding: 9px 14px; font-size: 10px; color: #7C8B83; border-top: 1px solid var(--line); background: var(--paper-dim); }
  .car-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 22px; }
  .car-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); color: var(--indigo); font-size: 16px; cursor: pointer; transition: all .15s; }

  .step {
    background: var(--white); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 24px 24px; box-shadow: 0 4px 14px rgba(23,16,42,0.05);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;

<header class="hero">

      <p class="lede">Las ayudas públicas existen y las entidades financieras buscan préstamos verdes. Lo que falta es un expediente completo: obras validadas por un técnico, ayudas identificadas, coste por vivienda y un préstamo que la comunidad pueda votar y la entidad pueda evaluar. Eso es lo que prepara RetroFin.</p>

<section id="problema">
  <div class="wrap">
    <div class="kicker">El problema</div>
    <h2 class="section-title">El cuello de botella no es el dinero. Es que nadie prepara la operación.</h2>
    <div class="problem-grid">
      <div>
        <p>En España, la mayoría de los edificios de vivienda se gestionan de forma colectiva: la comunidad de propietarios debe aprobar en junta cualquier obra antes de que empiece.</p>
        <p>La mayor parte de este parque se construyó antes de 1980, consume mucha más energía de la necesaria y es cada vez más difícil de habitar en los meses de calor extremo.</p>
        <p>Hay financiación pública disponible (subvenciones europeas, estatales y municipales) y entidades financieras con objetivos de préstamo verde. Aun así, pocas comunidades llegan a usarla.</p>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--indigo);margin-top:14px;">14 documentos · 3 programas de ayudas · licencias de 4 a 8 semanas · 3 presupuestos de obra, por cada comunidad.</p>
      </div>
      <div>
        <div class="stat-line"><span class="num mono">70%</span><span class="label">de la vivienda española se gestiona como comunidad de propietarios, no individualmente<sup>1</sup></span></div>
        <div class="stat-line"><span class="num mono">55%</span><span class="label">del coste de nuestro caso de referencia en Usera lo cubriría el Plan Rehabilita Madrid con las condiciones de la convocatoria de 2026, sin depender de otras ayudas<sup>2</sup></span></div>
      <p class="stat-sources"><sup>1</sup> Viviendas plurifamiliares en propiedad horizontal; España lidera la UE en población en pisos (~65%, Eurostat/INE). <sup>2</sup> Convocatoria 2026 del Plan Rehabilita Madrid (BOAM n.º 10.138, 2 de junio de 2026), zona ZETU: eficiencia energética 60%, conservación 50%, accesibilidad 75%.</p>
      </div>
    </div>
  </div>
</section>

<section class="dark-section" id="como-funciona">

    <div class="kicker">Cómo funciona</div>
    <h2 class="section-title">Cinco pasos, una sola junta.</h2>
    <p class="section-sub">Un arquitecto, tres presupuestos y una junta. El agente de IA prepara lo que el arquitecto valida, ordena lo que la comunidad vota y prepara lo acordado para su presentación.</p>
    <div class="mini-steps"><div class="ms" data-slide="0"><span class="ms-n">1</span><span class="ms-l">Datos</span></div><div class="ms-sep"></div><div class="ms" data-slide="1"><span class="ms-n">2</span><span class="ms-l">Arquitecto</span></div><div class="ms-sep"></div><div class="ms" data-slide="2"><span class="ms-n">3</span><span class="ms-l">Presupuestos</span></div><div class="ms-sep"></div><div class="ms" data-slide="3"><span class="ms-n">4</span><span class="ms-l">Votación</span></div><div class="ms-sep"></div><div class="ms" data-slide="4"><span class="ms-n">5</span><span class="ms-l">Documentos</span></div></div>
    <div class="car-wrap">
      <div class="car-track">

        <div class="step-head"><div class="num-circle num-ai">1</div><span class="role-badge role-ai">AGENTE IA</span></div>

          <li>La dirección autocompleta el perfil vía Catastro</li>
          <li>Obras obligatorias del IEE detectadas</li>
          <li>Paquete borrador: ayudas, financiación y umbrales de voto</li>
        </ul>

        <div class="shot"><div class="shot-bar"><i></i><i></i><i></i><span class="shot-url">app.retrofin.es · demo</span></div><div class="shot-hd"><div class="shot-hd-top"><span class="shot-hd-logo">🏢 RetroFin AI</span><span class="shot-hd-sub">Marcelo Usera 51 · Madrid</span></div><div class="shot-pills"><span class="shot-pill on">📋 Datos</span><span class="shot-pill">🏛 Arquitecto</span><span class="shot-pill">📨 Presupuestos</span><span class="shot-pill">🗳 Votación</span><span class="shot-pill">📤 Ejecución</span></div></div><!-- Para usar una captura real: sustituir el contenido de .shot-body por <img src="captura-paso-N.png" style="width:100%;display:block"> -->

<div class="car-slide">

      <div class="ledger-row positive"><span class="desc">El ahorro verificado amortiza la deuda<span class="ledger-sub">la venta de los certificados de ahorro energético (CAE) generados por la obra se destina a amortizar anticipadamente el préstamo de la comunidad</span></span><span class="amt">≈23.000 € brutos</span></div>

        <p style="color: var(--ink-soft); font-size: 15.5px; margin-bottom: 14px;">RetroFin AI nació pensando en historias como la de Manuela. Desde 2014, lideró la rehabilitación energética de su propio barrio, Orcasitas, edificio a edificio — convenciendo a vecinos escépticos, muchos de ellos mayores, de que merecía la pena votar sí.</p>

    <h2 class="section-title">Las piezas ya existen. Falta unirlas en un expediente.</h2>
    <p class="section-sub">La convocatoria 2026 del Plan Rehabilita Madrid destinó 50 millones de euros a la rehabilitación de edificios, con ayudas de hasta el 60% para eficiencia energética (y hasta el 75% para accesibilidad) en las zonas más vulnerables. Las entidades financieras tienen compromisos de préstamo verde: en 2026, el Grupo BEI y el ICO invirtieron en una titulización de UCI, que se comprometió a originar nuevos préstamos sostenibles para hogares y comunidades. Y desde 2023 el ahorro energético verificado puede venderse como CAE. RetroFin reúne las tres piezas en un expediente que la comunidad puede votar y la entidad puede evaluar. Nuestros honorarios son fijos e independientes del coste de la obra: no ganamos más si la reforma sale más cara.</p>

    <h2 class="section-title">Un equipo pequeño, con las tres piezas que este problema necesita.</h2>
    <p class="section-sub">Estructuración financiera, política climática urbana e ingeniería de producto — bajo un mismo techo.</p>
    <div class="team-story">
      <p>RetroFin nació de una frustración compartida: el dinero para rehabilitar existe (subvenciones, préstamos verdes, ahorro energético), pero pocos edificios consiguen usarlo. Construimos el primer prototipo para demostrar que un agente de IA podía cerrar esa distancia, y en AI Tinkerers Barcelona 2026 quedó en tercer puesto y ganó un NVIDIA H100 Incubation Prize. En septiembre de 2026 presentamos, junto a GEA21 y Samso EDS, una candidatura al programa europeo LIFE Clean Energy Transition para llevar el modelo a entre 15 y 20 edificios de Usera.</p>
      <p>Pero la inspiración viene de más cerca que la tecnología. Viene de Manuela Navarro, que desde 2014 acompañó a su propio barrio, Orcasitas (Usera), en una rehabilitación real, bloque a bloque: asambleas que pasaron de menos de 10 vecinos a más de 200, y facturas que bajaron a menos de la mitad. Nuestro trabajo es convertir lo que su barrio logró con años de esfuerzo en algo que cualquier comunidad pueda empezar.</p>

<section id="problema">
  <div class="wrap">
    <div class="kicker">The problem</div>
    <h2 class="section-title">The bottleneck isn't the money. It's that no one prepares the transaction.</h2>
    <div class="problem-grid">
      <div>
        <p>In Spain, most apartment buildings are owned collectively: the homeowner community (comunidad de propietarios) must approve any building-wide work at its assembly before it can begin.</p>
        <p>Most of this housing stock was built before 1980, uses far more energy than it needs to, and is increasingly hard to live in during extreme summer heat.</p>
        <p>Public funding is available (European, national and municipal subsidies) and lenders have green-lending targets. Even so, few communities manage to use them.</p>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--indigo);margin-top:14px;">14 documents · 3 subsidy programmes · 4–8 week permits · 3 builder quotes — per community.</p>
      </div>
      <div>
        <div class="stat-line"><span class="num mono">70%</span><span class="label">of Spanish housing is managed as a comunidad de propietarios, not individually<sup>1</sup></span></div>
        <div class="stat-line"><span class="num mono">55%</span><span class="label">of the cost of our reference case in Usera would be covered by Plan Rehabilita Madrid on the terms of its 2026 call, without relying on other subsidies<sup>2</sup></span></div>
      <p class="stat-sources"><sup>1</sup> Multi-unit homes under horizontal property; Spain leads the EU in flat-dwelling (~65%, Eurostat/INE). <sup>2</sup> Plan Rehabilita Madrid 2026 call (BOAM no. 10,138, 2 June 2026), ZETU zone: energy efficiency 60%, conservation 50%, accessibility 75%.</p>

      <div class="ledger-row positive"><span class="desc">Estimated energy savings<span class="ledger-sub">estimated drop in your household's energy bills after the retrofit</span></span><span class="amt">+€55/mo</span></div>
      <div class="ledger-row total positive"><span class="desc">Net result per household, once works are complete<span class="ledger-sub">what changes in your monthly budget: savings minus instalment</span></span><span class="amt">+€44/mo</span></div>
      <div class="ledger-phase">Then, with verified savings</div>
      <div class="ledger-row positive"><span class="desc">Verified savings pay down the debt<span class="ledger-sub">proceeds from selling the energy-savings certificates (CAE) generated by the works prepay the community's loan</span></span><span class="amt">≈€23,000 gross</span></div>
      <div class="ledger-note">During the works, the loan is drawn in tranches and bridges the gap until the subsidies are paid, after the works are certified. The instalment starts when the works finish, which is also when the energy savings begin. Afterwards, the sale of the CAE prepays part of the loan; in a documented case of a 40-unit building the proceeds were paid 6 to 9 months after works began. Spain's CAE system has been in force since 2023 (Royal Decree 36/2023).</div>
    </div>
  </div>
</section>

<section class="band-dark">
  <div class="wrap">
    <div class="kicker">Why now</div>
    <h2 class="section-title">The pieces already exist. What is missing is one file that joins them.</h2>
    <p class="section-sub">The 2026 Plan Rehabilita Madrid call allocated €50 million to building retrofits, covering up to 60% of energy-efficiency works (and up to 75% of accessibility works) in the most vulnerable areas. Lenders have green-lending commitments: in 2026 the EIB Group and ICO invested in a UCI securitisation, and UCI committed to originate new sustainable loans to households and homeowner communities. And since 2023 verified energy savings can be sold as CAE certificates. RetroFin brings the three together in one file the community can vote on and the lender can assess. Our fees are fixed and independent of the cost of the works: we do not earn more if the renovation costs more.</p>

<section id="equipo">
  <div class="wrap">
    <div class="kicker">Team</div>
    <h2 class="section-title">A small team, with the three pieces this problem needs.</h2>
    <p class="section-sub">Financial structuring, urban climate policy, and product engineering — under one roof.</p>
    <div class="team-story">
      <p>RetroFin was born from a shared frustration: the money to retrofit exists (subsidies, green loans, energy savings), yet few buildings manage to use it. We built the first prototype to prove an AI agent could close that gap, and at AI Tinkerers Barcelona 2026 it took third place and won an NVIDIA H100 Incubation Prize. In September 2026, together with GEA21 and Samso EDS, we submitted a bid to the European LIFE Clean Energy Transition programme to take the model to 15 to 20 buildings in Usera.</p>
      <p>But the inspiration comes from somewhere closer than the technology. It comes from Manuela Navarro, who from 2014 guided her own neighbourhood, Orcasitas (Usera), through a real block-by-block retrofit: assemblies that grew from fewer than 10 neighbours to over 200, and bills that dropped by more than half. Our job is to turn what her neighbourhood achieved through years of effort into something any community can start.</p>

window.__rfTimers = window.__rfTimers || [];
window.__rfInit = function(){
  try{ (window.__rfTimers||[]).forEach(function(t){ clearInterval(t); clearTimeout(t); }); }catch(e){}
  window.__rfTimers = [];
  var setInterval = function(f,t){ var id = window.setInterval(f,t); window.__rfTimers.push(id); return id; };
  var setTimeout  = function(f,t){ var id = window.setTimeout(f,t);  window.__rfTimers.push(id); return id; };
  var _epc = document.getElementById('epcBars'); if(_epc) _epc.innerHTML = '';
  if(document.getElementById('epcBars')){

  // EPC bar data: A (best) to G (worst), real Spanish EPC label proportions and colors
  const epcLevels = [
    { letter: 'A', color: '#2E8B3D', width: 34 },
    { letter: 'B', color: '#4CAF50', width: 42 },
    { letter: 'C', color: '#8DC63F', width: 50 },
    { letter: 'D', color: '#F2C230', width: 58 },
    { letter: 'E', color: '#EF8C1E', width: 66 },
    { letter: 'F', color: '#E4611F', width: 74 },
    { letter: 'G', color: '#D4341F', width: 82 },
  ];
  const container = document.getElementById('epcBars');
  epcLevels.forEach(lvl => {
    const row = document.createElement('div');
    row.className = 'epc-row';
    row.innerHTML = `
      <div class="epc-letter" style="background:${lvl.color}">${lvl.letter}</div>
      <div class="epc-bar" style="width:${lvl.width}%; background:${lvl.color}"></div>
    `;
    container.appendChild(row);
  });

  // Animate: highlight E first (current state), then transition emphasis to B (target state)
  const rows = container.querySelectorAll('.epc-row');
  function setState(activeLetter) {
    rows.forEach(r => {
      const letter = r.querySelector('.epc-letter').textContent;
      r.style.opacity = (letter === activeLetter) ? '1' : '0.32';
      r.style.transform = (letter === activeLetter) ? 'scale(1.03)' : 'scale(1)';
      r.style.transition = 'opacity .6s, transform .6s';
    });
  }
  setState('E');
  const afterLabel = document.getElementById('epcAfterLabel');
  setTimeout(() => {
    setState('B');
    afterLabel.textContent = 'B';
  }, 1600);
  setTimeout(() => { setState('E'); afterLabel.textContent = '—'; }, 5200);
  setInterval(() => {
    setState('E'); afterLabel.textContent = '—';
    setTimeout(() => { setState('B'); afterLabel.textContent = 'B'; }, 1600);
  }, 7000);

  }

  (function(){
    var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('visible')});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en,i){ if(en.isIntersecting){ en.target.style.transitionDelay=(Array.prototype.indexOf.call(els,en.target)%5)*70+'ms'; en.target.classList.add('visible'); io.unobserve(en.target);} });
    },{threshold:0.15});
    els.forEach(function(e){io.observe(e)});
  })();

  (function(){
    document.querySelectorAll('.car-wrap').forEach(function(w){
      var t=w.querySelector('.car-track'), slides=t.children.length;
      var dots=w.querySelectorAll('.car-dot');
      var minis=w.parentElement.querySelectorAll('.mini-steps .ms');
      function idx(){ return Math.round(t.scrollLeft / t.clientWidth); }
      function paint(){ var i=idx(); dots.forEach(function(d,j){ d.classList.toggle('on', j===i); }); minis.forEach(function(m,j){ m.classList.toggle('on', j===i); }); }
      function go(i){ t.scrollTo({left:Math.max(0,Math.min(slides-1,i))*t.clientWidth,behavior:'smooth'}); }
      w.querySelector('.car-prev').addEventListener('click',function(){ go(idx()-1); });
      w.querySelector('.car-next').addEventListener('click',function(){ go(idx()+1); });
      minis.forEach(function(m){ m.addEventListener('click',function(){ go(parseInt(m.dataset.slide,10)); }); });
      t.addEventListener('scroll',function(){ requestAnimationFrame(paint); });
      paint();
    });
  })();

};
</script>

  var closeBtn= document.getElementById('demo-close');
  var html = null;
  function demoHTML(){
    if(html) return html;
    var b64 = document.getElementById('demo-src').textContent.trim();
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    html = new TextDecoder('utf-8').decode(bytes);
    return html;
  }
  function curLang(){ var l=(document.documentElement.lang||'es').toLowerCase(); return l==='en'?'en':'es'; }
  function openDemo(){
    var bt = document.getElementById('demo-close-txt');
    if(bt) bt.textContent = curLang()==='en' ? 'Back to site' : 'Volver a la web';
    if(!frame.getAttribute('srcdoc')){
      frame.addEventListener('load', function(){
        try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
      });
      frame.setAttribute('srcdoc', demoHTML());
    } else {
      try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
    }
    overlay.classList.add('on');
    document.documentElement.classList.add('demo-open');
    document.body.classList.add('demo-open');
  }
  function closeDemo(){
    overlay.classList.remove('on');
    document.documentElement.classList.remove('demo-open');
    document.body.classList.remove('demo-open');
  }
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-open-demo]') : null;
    if(t){ e.preventDefault(); openDemo(); }
  });
  closeBtn.addEventListener('click', closeDemo);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && overlay.classList.contains('on')) closeDemo();
  });
  // keep the demo's language in sync if the site language changes while it's open
  window.addEventListener('hashchange', function(){
    if(!overlay.classList.contains('on')) return;
    try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
  });
})();
</script>
<script>
(function(){
  document.addEventListener('click', function(e){
    var t = e.target;
    var burger = t.closest ? t.closest('.nav-burger') : null;
    if(burger){
      e.preventDefault();
      var open = document.body.classList.toggle('menu-open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    var link = t.closest ? t.closest('a[href^="#"]') : null;
    if(link){
      var id = link.getAttribute('href').slice(1);
      var el = id && document.getElementById(id);
      if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
      document.body.classList.remove('menu-open');
      return;
    }
    if(document.body.classList.contains('menu-open') && !(t.closest && t.closest('nav'))){
      document.body.classList.remove('menu-open');
    }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.body.classList.remove('menu-open'); });
})();
</script>
<script>
/* Preview-only: the Claude in-app file viewer intercepts in-page (#) links and shows an
   "Open external link" prompt. On the real site we keep native anchors; only in the preview
   we neutralise the href and scroll via JS so navigation works without the prompt. */
(function(){
  var host = location.hostname || '';
  var isProd = host === 'retrofin.es' || host === 'www.retrofin.es';
  function scrollTo(id){
    var el = id && document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    document.body.classList.remove('menu-open');
  }
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-scroll]') : null;
    if(!t) return;
    e.preventDefault();
    scrollTo(t.getAttribute('data-scroll'));
  });
  if(isProd) return; // real site keeps normal anchors
  function strip(root){
    (root||document).querySelectorAll('a[href^="#"]').forEach(function(a){
      var href = a.getAttribute('href');
      if(!href || href === '#') return;
      a.setAttribute('data-scroll', href.slice(1));
      a.removeAttribute('href');
      a.style.cursor = 'pointer';
    });
  }
  strip(document);
  var app = document.getElementById('rf-app');
  if(app && window.MutationObserver){
    new MutationObserver(function(){ strip(app); }).observe(app, {childList:true, subtree:true});
  }
})();
</script>
<script>
(function(){
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var a=e.target;
    if(!a || !a.getAttribute || !a.getAttribute('data-scroll')) return;
    e.preventDefault();
    var el=document.getElementById(a.getAttribute('data-scroll'));
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    document.body.classList.remove('menu-open');
  });
})();
</script>
