<style>
  :root {
    --indigo: #1A7A5E;
    --indigo-deep: #0A4A3A;
    --bright: #2DB87A;
    --gold: #D4890A;
    --magenta: #D4890A;
    --dark: #072A20;
    --paper: #FFFFFF;
    --paper-page: #E9F4EF;
    --paper-dim: #E6F2EB;
    --ink: #0D1F1A;
    --ink-soft: #51625A;
    --line: #C8E8DC;
    --epc-e: #E8792C;
    --epc-c: #8DC63F;
    --epc-b: #4CAF50;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
    background: var(--paper-page);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  section { padding: 96px 0; }
  @media (max-width: 720px) { section { padding: 64px 0; } .wrap { padding: 0 20px; } }

  /* ===== Nav ===== */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 20px 0;
    position: sticky; top: 0; z-index: 50;
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink); letter-spacing: -0.02em; }
  .logo span { color: var(--magenta); }
  .nav-links { display: flex; align-items: center; gap: 36px; font-size: 14.5px; }
  .nav-links a { color: var(--ink-soft); text-decoration: none; transition: color .15s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta {
    background: var(--indigo-deep); color: var(--white); padding: 10px 20px;
    border-radius: 6px; font-size: 14px; font-weight: 500; text-decoration: none;
    transition: background .15s;
  }
  .nav-cta:hover { background: var(--indigo); }
  @media (max-width: 780px) { .nav-links { display: none; } }

  /* ===== Hero ===== */
  .hero {
    background: linear-gradient(180deg, #E3F1EA 0%, var(--paper-page) 92%);
    color: var(--ink);
    padding: 88px 0 64px;
    overflow: hidden;
    position: relative;
  }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
  @media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; } }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--indigo); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content: ''; width: 22px; height: 1px; background: var(--magenta); display: inline-block; }
  .hero h1 {
    font-size: clamp(32px, 4.4vw, 50px); line-height: 1.08; margin-bottom: 22px;
  }
  .hero h1 em { color: var(--magenta); font-style: normal; }
  .hero p.lede { font-size: 18px; color: var(--ink-soft); max-width: 480px; margin-bottom: 32px; }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--indigo-deep); color: var(--white); padding: 14px 26px; border-radius: 7px;
    text-decoration: none; font-weight: 500; font-size: 15px; transition: transform .15s, background .15s;
    display: inline-block;
  }
  .btn-primary:hover { background: var(--indigo); transform: translateY(-1px); }
  .btn-ghost {
    border: 1px solid var(--ink-soft); color: var(--ink); padding: 13px 24px; border-radius: 7px;
    text-decoration: none; font-weight: 500; font-size: 15px; transition: border-color .15s, background .15s;
    display: inline-block;
  }
  .btn-ghost:hover { border-color: var(--ink); background: var(--paper-dim); }

  /* ===== EPC signature ===== */
  .epc-card {
    background: var(--white); border-radius: 14px; padding: 28px 26px 24px;
    box-shadow: 0 18px 48px rgba(10,74,58,0.14);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .epc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .epc-head h3 { font-size: 13px; color: var(--ink-soft); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-family: 'IBM Plex Mono', monospace; }
  .epc-address { font-size: 12.5px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin-bottom: 18px; }
  .epc-bars { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
  .epc-row { display: flex; align-items: center; gap: 10px; height: 27px; }
  .epc-letter {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--white);
    width: 27px; height: 27px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .epc-bar { height: 27px; border-radius: 0 5px 5px 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; position: relative; transition: opacity .4s; }
  .epc-marker {
    position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    transition: left 1.4s cubic-bezier(.2,.8,.2,1);
  }
  .epc-marker-label {
    position: absolute; color: white; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px;
    padding-right: 6px;
  }
  .epc-foot { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .epc-stat { text-align: left; }
  .epc-stat .k { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; font-family: 'IBM Plex Mono', monospace; }
  .epc-stat .v { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; margin-top: 2px; }
  .epc-stat .v.good { color: #2E8B3D; }

  /* ===== Section headers ===== */
  .kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--magenta);
    text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px;
  }
  h2.section-title { font-size: clamp(26px, 3vw, 36px); margin-bottom: 18px; max-width: 640px; }
  .section-sub { color: var(--ink-soft); font-size: 17px; max-width: 620px; margin-bottom: 48px; }
  .dark-section { background: var(--paper-dim); color: var(--ink); }
  .band-dark {
    background: linear-gradient(150deg, var(--dark) 0%, var(--indigo-deep) 62%, var(--indigo) 100%);
    color: var(--white);
  }
  .band-dark .kicker { color: #7FD9B6; }
  .band-dark .section-sub { color: #BFE3D5; }
  .dark-section .section-sub { color: var(--ink-soft); }
  .dark-section .kicker { color: var(--magenta); }

  /* ===== Problem ===== */
  .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 800px) { .problem-grid { grid-template-columns: 1fr; } }
  .problem-grid p { font-size: 16px; color: var(--ink-soft); margin-bottom: 16px; }
  .stat-line { display: flex; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .stat-line .num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; color: var(--indigo); min-width: 90px; }
  .stat-line .label { font-size: 14.5px; color: var(--ink-soft); }
  .stat-sources { font-size: 10px; zoom: 0.8; color: #9AABA1; line-height: 1.5; margin-top: 16px; max-width: 760px; }
  .stat-sources sup { color: var(--magenta); font-weight: 600; font-size: 8px; }

  /* ===== Steps ===== */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 28px; }
  @media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(198px, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
  .step { display: flex; flex-direction: column; padding: 22px 18px 18px; }
  .step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .num-circle {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--white);
  }
  .num-ai { background: var(--indigo); } .num-human { background: var(--magenta); color: #053024; }
  .role-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .06em; font-weight: 600;
    padding: 5px 9px; border-radius: 8px;
  }
  .role-ai { background: rgba(22,107,82,0.09); color: var(--indigo); }
  .role-human { background: rgba(212,137,10,0.10); color: var(--magenta); }
  .step h4 { font-size: 16px; margin-bottom: 12px; }
  .step ul { list-style: none; margin: 0 0 16px; padding: 0; }
  .step ul li { font-size: 13px; color: var(--ink-soft); padding-left: 15px; position: relative; margin-bottom: 8px; line-height: 1.45; }
  .step ul li::before { content: "•"; position: absolute; left: 0; color: var(--magenta); }
  .step .step-icon { margin: auto auto 16px; background: none; border: none; width: auto; height: auto; }
  .step-pill {
    margin-top: auto; text-align: center; font-size: 12px; font-weight: 600; padding: 9px 10px; border-radius: 9px;
  }
  .pill-ai { background: rgba(22,107,82,0.07); color: var(--indigo); }
  .pill-human { background: rgba(212,137,10,0.08); color: var(--magenta); }
  .mini-steps { display: flex; align-items: center; gap: 0; margin: 6px 0 26px; flex-wrap: wrap; }
  .ms { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; border-radius: 99px; transition: background .15s; }
  .ms:hover { background: var(--paper-dim); }
  .ms-n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; transition: all .2s; }
  .ms-l { font-size: 13px; color: var(--ink-soft); }
  .ms.on .ms-n { background: var(--magenta); color: #053024; }
  .ms.on .ms-l { color: var(--ink); font-weight: 600; }
  .ms-sep { width: 26px; height: 2px; background: var(--line); margin: 0 2px; }
  @media (max-width: 700px) { .ms-l { display: none; } .ms-sep { width: 14px; } }
  .car-wrap { position: relative; }
  .car-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 24px; scrollbar-width: none; }
  .car-track::-webkit-scrollbar { display: none; }
  .car-slide { min-width: 100%; scroll-snap-align: start; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; align-items: stretch; }
  @media (max-width: 760px) { .car-slide { grid-template-columns: 1fr; } }
  .car-slide .step { height: 100%; }
  .shot { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .shot-bar { display: flex; gap: 6px; padding: 11px 14px; background: var(--paper-dim); border-bottom: 1px solid var(--line); }
  .shot-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .shot-bar i:first-child { background: var(--magenta); opacity: .6; }
  .shot-body { padding: 22px 26px; font-size: 13.5px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .shot-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); padding: 12px 26px 0; }
  .shot { min-height: 340px; }
  .sh-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .sh-l { color: #7C8B83; } .sh-v { color: var(--ink); font-weight: 600; text-align: right; }
  .sh-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
  .sh-chip { font-size: 11px; padding: 4px 9px; border-radius: 99px; background: var(--paper-dim); color: var(--ink-soft); }
  .sh-chip.ok { background: rgba(46,139,61,0.1); color: #2E8B3D; }
  .sh-note { margin-top: 15px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--indigo); }
  .sh-check { padding: 8px 0; border-bottom: 1px dashed var(--line); color: var(--ink); }
  .sh-check.pending { color: #7C8B83; }
  .sh-sign { margin-top: 14px; font-size: 11.5px; color: #7C8B83; font-style: italic; }
  .sh-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .sh-table th, .sh-table td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  .sh-table th:first-child, .sh-table td:first-child { text-align: left; color: #7C8B83; }
  .sh-table .hl { background: rgba(22,107,82,0.06); color: var(--indigo); font-weight: 600; }
  .sh-vote { margin-top: 14px; }
  .sh-votebar { height: 12px; border-radius: 99px; background: rgba(212,137,10,0.15); overflow: hidden; }
  .sh-votebar span { display: block; height: 100%; background: var(--indigo); border-radius: 99px; }
  .sh-votelabels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .shot-bar { align-items: center; }
  .shot-url { flex: 1; margin-left: 8px; background: var(--white); border: 1px solid var(--line); border-radius: 99px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7C8B83; padding: 4px 12px; }
  .shot-app { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--white); }
  .shot-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink); }
  .shot-logo b { color: var(--magenta); }
  .shot-step { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--indigo); background: rgba(22,107,82,0.08); padding: 3px 9px; border-radius: 99px; }
  .shot-body { background: #F5FBF8; }
  .sh-card { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(23,16,42,0.04); }
  .sh-card + .sh-card, .sh-card + .sh-note, .sh-chips + .sh-note { margin-top: 12px; }
  .shot-caption { padding: 9px 14px; font-size: 10px; color: #7C8B83; border-top: 1px solid var(--line); background: var(--paper-dim); }
  .car-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 22px; }
  .car-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); color: var(--indigo); font-size: 16px; cursor: pointer; transition: all .15s; }
  .car-btn:hover { border-color: var(--indigo); }
  .car-dots { display: flex; gap: 8px; }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .2s; }
  .car-dot.on { background: var(--magenta); }


  .step {
    background: var(--white); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 24px 24px; box-shadow: 0 4px 14px rgba(23,16,42,0.05);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .step:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(23,16,42,0.11); border-color: rgba(22,107,82,0.28); }
  .step-icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(22,107,82,0.10), rgba(212,137,10,0.13));
    border: 1px solid rgba(22,107,82,0.16);
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
  }
  .step-icon svg { width: 46px; height: 46px; }
  .step .step-num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--magenta); margin-bottom: 14px; }
  .step h4 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin-bottom: 10px; }
  .step p { font-size: 14.5px; color: var(--ink-soft); }

  /* ===== Prize strip ===== */
  .prize-strip {
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
    margin-top: 28px; padding-top: 24px; border-top: 1px dashed var(--line);
  }
  .prize-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-soft); }
  .prize-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--magenta); }

  /* ===== Team ===== */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; }
  .team-card { }
  .team-avatar {
    width: 64px; height: 64px; border-radius: 50%; background: var(--indigo);
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: var(--white);
  }
  .team-card h4 { font-size: 17px; margin-bottom: 4px; }
  .team-card .role { font-size: 13px; color: var(--magenta); font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px; }
  .team-photo { display: block; width: 76px; height: 76px; border-radius: 50%; margin-bottom: 16px; text-decoration: none; overflow: hidden; }
  .team-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .team-avatar { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: var(--white); letter-spacing: -0.02em; }
  .av-indigo { background: linear-gradient(135deg, var(--indigo), var(--indigo-deep)); }
  .av-magenta { background: linear-gradient(135deg, var(--magenta), #A6690A); }
  .av-deep { background: linear-gradient(135deg, var(--indigo-deep), var(--dark)); }
  .team-li { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: var(--indigo); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; transition: all .15s; }
  .team-li:hover { border-color: var(--indigo); background: rgba(22,107,82,0.05); }
  .team-card p { font-size: 14px; color: var(--ink-soft); }
  .team-story p { font-size: 16px; color: var(--ink-soft); max-width: 760px; margin-bottom: 16px; }
  #equipo .prize-strip { margin-top: 20px; margin-bottom: 56px; padding-top: 20px; }

  /* ===== Inspiration (Manuela) ===== */
  .inspo {
    display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 48px; align-items: center;
    background: var(--paper-dim); border-radius: 16px; padding: 44px; overflow: hidden;

    <div class="problem-grid">
      <div>
        <p>En España, la mayoría de los edificios de vivienda se gestionan de forma colectiva: un grupo de vecinos — una comunidad de propietarios — debe votar junta antes de que cualquier obra pueda empezar.</p>
        <p>La mayor parte de este parque está construido antes de 1980, gasta mucha más energía de la necesaria, y cada vez es más difícil de habitar en los meses de calor extremo.</p>
        <p>Hay dinero público disponible — subvenciones europeas, nacionales, municipales — e incluso un aval del Estado ya pensado exactamente para este tipo de obra. Aun así, apenas se utiliza.</p>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--indigo);margin-top:14px;">14 documentos · 3 programas de ayudas · licencias de 4–8 semanas · 3 presupuestos de obra — por cada comunidad.</p>

<section id="numeros">

    <h2 class="section-title">Un caso real, no una proyección genérica.</h2>
    <p class="section-sub">Edificio de 24 viviendas en Usera, Madrid — 1972, certificado energético E.</p>
    <div class="ledger">
      <div class="ledger-row"><span class="desc">Coste total de la rehabilitación</span><span class="amt">99.400 €</span></div>
      <div class="ledger-row"><span class="desc">Cubierto por subvenciones</span><span class="amt">58.400 €</span></div>
      <div class="ledger-row total"><span class="desc">Préstamo comunitario resultante</span><span class="amt">31.800 €</span></div>
      <div class="ledger-phase">Durante la ejecución de las obras</div>
      <div class="ledger-row"><span class="desc">Cuota mensual por vivienda<span class="ledger-sub">su parte del préstamo comunitario, pagada a través de la cuota de comunidad</span></span><span class="amt">−11 €/mes</span></div>
      <div class="ledger-phase">Una vez finalizadas las obras</div>
      <div class="ledger-row positive"><span class="desc">Ahorro energético estimado<span class="ledger-sub">reducción estimada de la factura energética de su hogar tras la rehabilitación</span></span><span class="amt">+55 €/mes</span></div>
      <div class="ledger-row total positive"><span class="desc">Resultado neto por hogar, una vez finalizadas las obras<span class="ledger-sub">lo que cambia en su presupuesto mensual: ahorro menos cuota</span></span><span class="amt">+44 €/mes</span></div>
      <div class="ledger-phase">Y lo que no se había hecho hasta ahora</div>
      <div class="ledger-row positive"><span class="desc">El ahorro verificado amortiza la deuda<span class="ledger-sub">los certificados de ahorro energético (CAE) generan una devolución que reduce el préstamo de la comunidad — hasta donde sabemos, la primera vez que se aplica a escala de comunidad de propietarios</span></span><span class="amt">≈23.000 €</span></div>
      <div class="ledger-note">La cuota del préstamo empieza cuando arrancan las obras; el ahorro energético llega una vez terminada la rehabilitación — hay un periodo de obra entre ambas cosas (en un caso real documentado de un edificio de 40 viviendas, unos 4–5 meses). El préstamo se abarata todavía más cuando el ahorro real verificado activa una devolución vía el sistema de certificados de ahorro energético (CAE) — ya existente, no una promesa. En ese mismo caso, la devolución CAE se cobró entre 6 y 9 meses después del inicio de las obras.</div>

        <p style="color: var(--ink-soft); font-size: 15.5px; margin-bottom: 14px;">RetroFin AI nació pensando en historias como la de Manuela. Desde 2014, lideró la rehabilitación energética de su propio barrio, Orcasitas, edificio a edificio — convenciendo a vecinos escépticos, muchos de ellos mayores, de que merecía la pena votar sí.</p>

    <div class="team-story">
      <p>RetroFin nació de una frustración compartida: el dinero para rehabilitar existe — subvenciones, avales públicos, ahorro energético — pero casi ningún edificio consigue usarlo. Construimos el primer prototipo para demostrar que un agente de IA podía cerrar esa distancia, y en AI Tinkerers Barcelona 2026 quedó en tercer puesto y ganó un NVIDIA H100 Incubation Prize. Hoy preparamos, junto a GEA21 y Samso EDS, una candidatura al programa europeo LIFE Clean Energy Transition para llevar el modelo a 15–20 edificios de Usera.</p>
      <p>Pero la inspiración viene de más cerca que la tecnología. Viene de Manuela Navarro, que desde 2014 acompañó a su propio barrio — Orcasitas, en Usera — en una rehabilitación real, bloque a bloque: asambleas que pasaron de menos de 10 vecinos a más de 200, y facturas que bajaron a menos de la mitad. Nuestro trabajo es convertir lo que su barrio logró con años de esfuerzo en algo que cualquier comunidad pueda empezar.</p>

<section id="problema">
  <div class="wrap">
    <div class="kicker">The problem</div>
    <h2 class="section-title">The bottleneck isn't the money. It's that no one structures the case.</h2>
    <div class="problem-grid">
      <div>
        <p>In Spain, most apartment buildings are owned collectively: a group of neighbours — a comunidad de propietarios — must agree together before any building-wide work can begin.</p>
        <p>Most of this housing stock was built before 1980, uses far more energy than it needs to, and is increasingly hard to live in during extreme summer heat.</p>
        <p>There is public money available — European, national, municipal subsidies — and even a government-backed loan guarantee already designed for exactly this kind of work. Even so, it barely gets used.</p>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--indigo);margin-top:14px;">14 documents · 3 subsidy programmes · 4–8 week permits · 3 builder quotes — per community.</p>
      </div>
      <div>
        <div class="stat-line"><span class="num mono">70%</span><span class="label">of Spanish housing is managed as a comunidad de propietarios, not individually<sup>1</sup></span></div>
        <div class="stat-line"><span class="num mono">50%</span><span class="label">of the credit risk on energy-retrofit loans is already covered by the State — an existing guarantee line, not something we're proposing to create<sup>2</sup></span></div>
      <p class="stat-sources"><sup>1</sup> Multi-unit homes under horizontal property; Spain leads the EU in flat-dwelling (~65%, Eurostat/INE). <sup>2</sup> MIVAU–ICO guarantee line, in force: 50% State guarantee, free, for buildings with a granted subsidy (ICO/MIVAU).</p>

      <div class="ledger-row total positive"><span class="desc">Net result per household, once works are complete<span class="ledger-sub">what changes in your monthly budget: savings minus instalment</span></span><span class="amt">+€44/mo</span></div>
      <div class="ledger-phase">And what had not been done before</div>
      <div class="ledger-row positive"><span class="desc">Verified savings pay down the debt<span class="ledger-sub">energy-savings certificates (CAE) generate a rebate that reduces the community's loan — to our knowledge, the first time this is applied at homeowner-community level</span></span><span class="amt">≈€23,000</span></div>

    <h2 class="section-title">We didn't invent the guarantee. We made it reachable.</h2>
    <p class="section-sub">The State already covers 50% of the credit risk on energy-retrofit loans tied to an already-granted public rehabilitation subsidy — up to €30,000 per household, over 15 years, at no cost to the bank or the community. For your community that means something very concrete: this isn't a scheme on paper. At least one bank grants these State-backed loans today — so a community whose subsidy has been approved can apply for one right now. Our fees are fixed and independent of the cost of the works: we do not earn more if the renovation gets more expensive.</p>

<section id="equipo">
  <div class="wrap">
    <div class="kicker">Team</div>
    <h2 class="section-title">A small team, with the three pieces this problem needs.</h2>
    <p class="section-sub">Financial structuring, urban climate policy, and product engineering — under one roof.</p>
    <div class="team-story">
      <p>RetroFin was born from a shared frustration: the money to retrofit exists — subsidies, public guarantees, energy savings — yet almost no building manages to use it. We built the first prototype to prove an AI agent could close that gap, and at AI Tinkerers Barcelona 2026 it took third place and won an NVIDIA H100 Incubation Prize. Together with GEA21 and Samso EDS we are now preparing a bid to the European LIFE Clean Energy Transition programme, to take the model to 15–20 buildings in Usera.</p>
      <p>But the inspiration comes from somewhere closer than the technology. It comes from Manuela Navarro, who from 2014 walked her own neighbourhood — Orcasitas, in Usera — through a real block-by-block retrofit: assemblies that grew from fewer than 10 neighbours to over 200, and bills that dropped by more than half. Our job is to turn what her neighbourhood achieved through years of effort into something any community can start.</p>

window.__rfTimers = window.__rfTimers || [];
window.__rfInit = function(){
  try{ (window.__rfTimers||[]).forEach(function(t){ clearInterval(t); clearTimeout(t); }); }catch(e){}
  window.__rfTimers = [];
  var setInterval = function(f,t){ var id = window.setInterval(f,t); window.__rfTimers.push(id); return id; };
  var setTimeout  = function(f,t){ var id = window.setTimeout(f,t);  window.__rfTimers.push(id); return id; };
  var _epc = document.getElementById('epcBars'); if(_epc) _epc.innerHTML = '';
  if(document.getElementById('epcBars')){

  // EPC bar data: A (best) to G (worst), real Spanish EPC label proportions and colors
  const epcLevels = [
    { letter: 'A', color: '#2E8B3D', width: 34 },
    { letter: 'B', color: '#4CAF50', width: 42 },
    { letter: 'C', color: '#8DC63F', width: 50 },
    { letter: 'D', color: '#F2C230', width: 58 },
    { letter: 'E', color: '#EF8C1E', width: 66 },
    { letter: 'F', color: '#E4611F', width: 74 },
    { letter: 'G', color: '#D4341F', width: 82 },
  ];
  const container = document.getElementById('epcBars');
  epcLevels.forEach(lvl => {
    const row = document.createElement('div');
    row.className = 'epc-row';
    row.innerHTML = `
      <div class="epc-letter" style="background:${lvl.color}">${lvl.letter}</div>
      <div class="epc-bar" style="width:${lvl.width}%; background:${lvl.color}"></div>
    `;
    container.appendChild(row);
  });

  // Animate: highlight E first (current state), then transition emphasis to C (target state)
  const rows = container.querySelectorAll('.epc-row');
  function setState(activeLetter) {
    rows.forEach(r => {
      const letter = r.querySelector('.epc-letter').textContent;
      r.style.opacity = (letter === activeLetter) ? '1' : '0.32';
      r.style.transform = (letter === activeLetter) ? 'scale(1.03)' : 'scale(1)';
      r.style.transition = 'opacity .6s, transform .6s';
    });
  }
  setState('E');
  const afterLabel = document.getElementById('epcAfterLabel');
  setTimeout(() => {
    setState('C');
    afterLabel.textContent = 'C';
  }, 1600);
  setTimeout(() => { setState('E'); afterLabel.textContent = '—'; }, 5200);
  setInterval(() => {
    setState('E'); afterLabel.textContent = '—';
    setTimeout(() => { setState('C'); afterLabel.textContent = 'C'; }, 1600);
  }, 7000);

  }

  (function(){
    var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('visible')});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en,i){ if(en.isIntersecting){ en.target.style.transitionDelay=(Array.prototype.indexOf.call(els,en.target)%5)*70+'ms'; en.target.classList.add('visible'); io.unobserve(en.target);} });
    },{threshold:0.15});
    els.forEach(function(e){io.observe(e)});
  })();

  (function(){
    document.querySelectorAll('.car-wrap').forEach(function(w){
      var t=w.querySelector('.car-track'), slides=t.children.length;
      var dots=w.querySelectorAll('.car-dot');
      var minis=w.parentElement.querySelectorAll('.mini-steps .ms');
      function idx(){ return Math.round(t.scrollLeft / t.clientWidth); }
      function paint(){ var i=idx(); dots.forEach(function(d,j){ d.classList.toggle('on', j===i); }); minis.forEach(function(m,j){ m.classList.toggle('on', j===i); }); }
      function go(i){ t.scrollTo({left:Math.max(0,Math.min(slides-1,i))*t.clientWidth,behavior:'smooth'}); }
      w.querySelector('.car-prev').addEventListener('click',function(){ go(idx()-1); });
      w.querySelector('.car-next').addEventListener('click',function(){ go(idx()+1); });
      minis.forEach(function(m){ m.addEventListener('click',function(){ go(parseInt(m.dataset.slide,10)); }); });
      t.addEventListener('scroll',function(){ requestAnimationFrame(paint); });
      paint();
    });
  })();

};
</script>

    if(bt) bt.textContent = curLang()==='en' ? 'Back to site' : 'Volver a la web';
    if(!frame.getAttribute('srcdoc')){
      frame.addEventListener('load', function(){
        try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
      });
      frame.setAttribute('srcdoc', demoHTML());
    } else {
      try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
    }
    overlay.classList.add('on');
    document.documentElement.classList.add('demo-open');
    document.body.classList.add('demo-open');
  }
  function closeDemo(){
    overlay.classList.remove('on');
    document.documentElement.classList.remove('demo-open');
    document.body.classList.remove('demo-open');
  }
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-open-demo]') : null;
    if(t){ e.preventDefault(); openDemo(); }
  });
  closeBtn.addEventListener('click', closeDemo);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && overlay.classList.contains('on')) closeDemo();
  });
  // keep the demo's language in sync if the site language changes while it's open
  window.addEventListener('hashchange', function(){
    if(!overlay.classList.contains('on')) return;
    try{ if(frame.contentWindow && frame.contentWindow.__rfSetLang) frame.contentWindow.__rfSetLang(curLang()); }catch(_){}
  });
})();
</script>
<script>
(function(){
  document.addEventListener('click', function(e){
    var t = e.target;
    var burger = t.closest ? t.closest('.nav-burger') : null;
    if(burger){
      e.preventDefault();
      var open = document.body.classList.toggle('menu-open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    var link = t.closest ? t.closest('a[href^="#"]') : null;
    if(link){
      var id = link.getAttribute('href').slice(1);
      var el = id && document.getElementById(id);
      if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
      document.body.classList.remove('menu-open');
      return;
    }
    if(document.body.classList.contains('menu-open') && !(t.closest && t.closest('nav'))){
      document.body.classList.remove('menu-open');
    }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.body.classList.remove('menu-open'); });
})();
</script>
<script>
/* Preview-only: the Claude in-app file viewer intercepts in-page (#) links and shows an
   "Open external link" prompt. On the real site we keep native anchors; only in the preview
   we neutralise the href and scroll via JS so navigation works without the prompt. */
(function(){
  var host = location.hostname || '';
  var isProd = host === 'retrofin.es' || host === 'www.retrofin.es';
  function scrollTo(id){
    var el = id && document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    document.body.classList.remove('menu-open');
  }
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-scroll]') : null;
    if(!t) return;
    e.preventDefault();
    scrollTo(t.getAttribute('data-scroll'));
  });
  if(isProd) return; // real site keeps normal anchors
  function strip(root){
    (root||document).querySelectorAll('a[href^="#"]').forEach(function(a){
      var href = a.getAttribute('href');
      if(!href || href === '#') return;
      a.setAttribute('data-scroll', href.slice(1));
      a.removeAttribute('href');
      a.style.cursor = 'pointer';
    });
  }
  strip(document);
  var app = document.getElementById('rf-app');
  if(app && window.MutationObserver){
    new MutationObserver(function(){ strip(app); }).observe(app, {childList:true, subtree:true});
  }
})();
</script>
<script>
(function(){
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var a=e.target;
    if(!a || !a.getAttribute || !a.getAttribute('data-scroll')) return;
    e.preventDefault();
    var el=document.getElementById(a.getAttribute('data-scroll'));
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    document.body.classList.remove('menu-open');
  });
})();
</script>
