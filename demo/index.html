<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroFin AI · Demo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
@keyframes dotBounce { 0%,80%,100%{transform:scale(.5);opacity:.4} 40%{transform:scale(1);opacity:1} }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: #c8e8dc; border-radius: 3px; }

/* ===== Bilingual + mobile chat controls (added) ===== */
#rf-open-chat,#rf-close-chat{display:none;}
@media (max-width:820px){
  .rf-chat{
    position:fixed !important;top:0 !important;right:0 !important;bottom:0 !important;
    width:min(86vw,360px) !important;height:100vh !important;height:100dvh !important;
    z-index:2000 !important;transform:translateX(103%);transition:transform .28s ease;
    box-shadow:-10px 0 34px rgba(0,0,0,.30) !important;border-left:1px solid #cfe7dc !important;
  }
  body.rf-chat-open .rf-chat{transform:translateX(0);}
  .rf-main{padding-left:14px !important;padding-right:14px !important;}
  .rf-header{overflow-x:auto !important;-webkit-overflow-scrolling:touch;}
  #rf-backdrop{position:fixed;inset:0;background:rgba(4,20,15,.42);z-index:1980;opacity:0;
    pointer-events:none;transition:opacity .28s ease;}
  body.rf-chat-open #rf-backdrop{opacity:1;pointer-events:auto;}
  #rf-open-chat{display:flex;align-items:center;justify-content:center;position:fixed;
    right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1900;
    width:58px;height:58px;border-radius:50%;background:#0a4a3a;color:#fff;border:none;
    font-size:26px;line-height:1;box-shadow:0 6px 22px rgba(0,0,0,.32);cursor:pointer;}
  body.rf-chat-open #rf-open-chat{display:none;}
  #rf-close-chat{display:flex;align-items:center;justify-content:center;position:fixed;
    z-index:2100;top:calc(10px + env(safe-area-inset-top,0px));right:12px;
    width:46px;height:46px;border-radius:50%;background:#fff;color:#0a4a3a;
    border:1px solid #cfe7dc;font-size:22px;font-weight:700;line-height:1;
    box-shadow:0 4px 16px rgba(0,0,0,.22);cursor:pointer;}
  body:not(.rf-chat-open) #rf-close-chat{display:none;}
}

</style>
</head>
