<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroFin AI — Demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234B0082'/%3E%3Ctext x='50' y='72' font-size='62' font-weight='bold' font-family='sans-serif' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--indigo:#4B0082;--deep:#35005C;--dark:#17102A;--magenta:#C2185B;--ink:#1A1A2E;--soft:#5B5570;--muted:#8A80A0;--line:#E4DFEF;--tint:#F5F3FA;--bg:#FBFAFD;--white:#FFF;--green:#2E8B3D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--tint);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:18px}.logo b{color:var(--magenta)}
.demo-tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--indigo);background:rgba(75,0,130,.08);padding:3px 10px;border-radius:99px;margin-left:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:none;background:var(--white);padding:6px 14px;font-family:'IBM Plex Mono';font-size:11px;cursor:pointer;color:var(--soft)}
.lang button.on{background:var(--indigo);color:#fff}
.chips{display:flex;align-items:center;gap:2px;padding:14px 22px 0;flex-wrap:wrap;max-width:1080px;margin:0 auto;width:100%}
.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;cursor:pointer}
.chip:hover{background:rgba(75,0,130,.05)}
.chip .n{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--soft);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:12px}
.chip .l{font-size:12px;color:var(--soft)}
.chip.on .n{background:var(--magenta);color:#fff}.chip.on .l{color:var(--ink);font-weight:600}
.chip.done .n{background:var(--indigo);color:#fff}
.sep{width:18px;height:2px;background:var(--line)}
main{flex:1;max-width:1080px;margin:0 auto;width:100%;padding:16px 22px 30px}
.screen{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(23,16,42,.07)}
.bar{display:flex;gap:6px;padding:10px 16px;background:var(--tint);border-bottom:1px solid var(--line);align-items:center}
.bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}.bar i:first-child{background:var(--magenta);opacity:.6}
.url{flex:1;margin-left:8px;background:var(--white);border:1px solid var(--line);border-radius:99px;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);padding:4px 12px}
.apphead{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--line)}
.scr-title{font-family:'Space Grotesk';font-weight:600;font-size:15px}
.stepchip{font-family:'IBM Plex Mono';font-size:10px;color:var(--indigo);background:rgba(75,0,130,.08);padding:3px 10px;border-radius:99px}
.body{padding:24px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.body{grid-template-columns:1fr}}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(23,16,42,.04)}
.card h5{font-size:12px;font-family:'IBM Plex Mono';font-weight:600;color:var(--indigo);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted)}.row .v{font-weight:600;text-align:right}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--soft)}
.tag.ok{background:rgba(46,139,61,.1);color:var(--green)}
.tag.warn{background:rgba(194,24,91,.09);color:var(--magenta)}
.note{margin-top:12px;font-family:'IBM Plex Mono';font-size:11px;color:var(--indigo)}
.check{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.check:last-child{border-bottom:none}
.check.pend{color:var(--muted)}
.btn{display:inline-block;background:var(--magenta);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans'}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--muted)}
.hl{background:rgba(75,0,130,.06);color:var(--indigo);font-weight:600}
.votebar{height:14px;border-radius:99px;background:rgba(194,24,91,.15);overflow:hidden;margin-top:8px}
.votebar span{display:block;height:100%;width:0;background:var(--indigo);border-radius:99px;transition:width 1.2s ease}
.votelbl{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.ledg .row .v.pos{color:var(--green)}
.footnav{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-top:1px solid var(--line);background:var(--white)}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.wide{grid-column:1/-1}
footer{padding:14px 22px;text-align:center}
footer .small a{color:var(--indigo)}
.pulse{animation:pu 1.6s ease infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <span class="logo"><b>●</b> RetroFin AI</span><span class="demo-tag" data-t="demoTag"></span>
  </div>
  <div class="lang"><button id="btn-es" onclick="setLang('es')">ES</button><button id="btn-en" onclick="setLang('en')">EN</button></div>
</header>
<div class="chips" id="chips"></div>
<main><div class="screen">
  <div class="bar"><i></i><i></i><i></i><span class="url">demo.retrofin.es</span></div>
  <div class="apphead"><span class="scr-title" id="scrTitle"></span><span class="stepchip" id="stepChip"></span></div>
  <div class="body" id="body"></div>
  <div class="footnav">
    <button class="btn ghost" id="prev" onclick="go(-1)"></button>
    <span class="small" id="progress"></span>
    <button class="btn" id="next" onclick="go(1)"></button>
  </div>
</div></main>
<footer><p class="small" id="foot"></p></footer>
<script>
const T={
es:{
 demoTag:"DEMO GUIADA", prev:"← Anterior", next:"Siguiente →", finish:"Volver al inicio ↺",
 stepOf:(i)=>`Paso ${i} de 5`, progress:(i)=>`${i} / 5`,
 foot:'Demo ilustrativa basada en un edificio real de Madrid (datos del caso, anonimizados donde procede). Los importes de ayudas y financiación son estimaciones del caso. · <a href="https://retrofin.es">retrofin.es</a>',
 chips:["Datos","Arquitecto","Presupuestos","Votación","Documentos"],
 titles:["Perfil del edificio","Validación técnica","Comparativa de presupuestos","Votación de la junta","Expediente y envíos"],
 s1:{profile:"Perfil · autocompletado vía Catastro",rows:[["Dirección","C/ de Marcelo Usera, 51 · Usera, Madrid"],["Año de construcción","1972"],["Viviendas","24"],["Certificado energético","E (estimado)"],["Zona","ZIRE ✓ · intensidad de ayuda reforzada"]],
  subs:"Pila de ayudas detectada",chips:["Plan Rehabilita Madrid 2026 ✓ abierta","Plan Estatal 2026–2030 ✓","ZIRE: ayuda reforzada ✓"],
  ite:"Inspección (ITE)",iteRows:["⚠ 2 reparaciones obligatorias detectadas","Se integran en el paquete de obras — la comunidad debe actuar igualmente"],
  note:"Paquete borrador generado: obras, ayudas, escenarios de financiación y umbrales de voto"},
 s2:{pm:"Arquitecta · project manager del proyecto",checks:["✓ Envolvente validada in situ","✓ Mediciones ajustadas sobre el borrador","✓ IEE emitido","✓ Certificado energético emitido","○ Licencia — en tramitación"],
  out:"Salidas de esta fase",outRows:[["Proyecto validado","listo para presupuestar"],["IEE + CEE","emitidos"],["Presupuesto de diseño","primera referencia de coste"]],
  note:"El experto valida primero — la IA prepara, la arquitecta decide"},
 s3:{cmp:"Comparativa homogénea · 3 constructoras",head:["","C1","C2","C3"],rows:[["Precio","102 k€","99,4 k€","108 k€"],["Plazo","6 meses","5 meses","5 meses"],["Garantía","2 años","3 años","2 años"],["Reparaciones ITE","incluidas","incluidas","parcial"]],
  neg:"Asistencia en la selección",negRows:["La comparativa se construye sobre el mismo proyecto validado","RetroFin asiste a la comunidad en la negociación de condiciones","La decisión final es siempre de la junta"],
  note:"C2 recomendada · mejor equilibrio precio–plazo–garantía"},
 s4:{ledg:"Números por vivienda · caso Usera 51",rows:[["Coste total de la rehabilitación","99.400 €",""],["Cubierto por ayudas","58.400 €",""],["Préstamo comunitario resultante","31.800 €",""],["Cuota mensual por vivienda (durante obras)","−85 €/mes",""],["Ahorro energético estimado (tras obras)","+200 €/mes","pos"],["Resultado neto por vivienda","+115 €/mes","pos"]],
  vote:"Votación en 2 pasos",voteQ:"Se vota: obras + constructora + préstamo",voteRes:"Sí · 78%",voteNo:"No · 22%",
  thr:"Umbrales: mayoría simple para envolvente e ITE (con ≥30% de ayuda pública) · 1/3 para renovables y aerotermia (RDL 7/2026)",
  note:"Umbral alcanzado ✓ · acta generada automáticamente"},
 s5:{docs:"Expediente · cada destinatario recibe solo lo suyo",checks:["✓ Acta de la junta.pdf","✓ Solicitud Plan Rehabilita.pdf","✓ Solicitud Plan Estatal.pdf","✓ Expediente bancario — UCI (préstamo con aval MIVAU–ICO del 50%)","○ Solicitud CAE — tras la verificación del ahorro"],
  cae:"Devolución CAE",caeRows:[["Mecanismo","ahorro verificado → amortización anticipada"],["Calendario (caso real)","cobro ~6–9 meses tras iniciar obras"],["Verificación","verificador acreditado (ENAC)"]],
  note:"Subir una vez, compartir selectivamente — la arquitecta supervisa las obras"},
},
en:{
 demoTag:"GUIDED DEMO", prev:"← Previous", next:"Next →", finish:"Back to start ↺",
 stepOf:(i)=>`Step ${i} of 5`, progress:(i)=>`${i} / 5`,
 foot:'Illustrative demo based on a real Madrid building (case data, anonymised where appropriate). Subsidy and financing amounts are case estimates. · <a href="https://retrofin.es/index-en.html">retrofin.es</a>',
 chips:["Data","Architect","Quotes","Vote","Documents"],
 titles:["Building profile","Technical validation","Quote comparison","Assembly vote","Dossier & submissions"],
 s1:{profile:"Profile · auto-filled via Cadastre",rows:[["Address","C/ de Marcelo Usera, 51 · Usera, Madrid"],["Year built","1972"],["Homes","24"],["EPC rating","E (estimated)"],["Zone","ZIRE ✓ · enhanced subsidy intensity"]],
  subs:"Subsidy stack detected",chips:["Plan Rehabilita Madrid 2026 ✓ open","Plan Estatal 2026–2030 ✓","ZIRE: enhanced aid ✓"],
  ite:"Building inspection (ITE)",iteRows:["⚠ 2 mandatory repairs detected","Folded into the works package — the community must act anyway"],
  note:"Draft package generated: works, subsidies, financing scenarios and vote thresholds"},
 s2:{pm:"Architect · project manager",checks:["✓ Envelope validated on site","✓ Measurements adjusted over the draft","✓ IEE issued","✓ Energy certificate issued","○ Permit — in progress"],
  out:"Outputs of this phase",outRows:[["Validated project","ready to be quoted"],["IEE + EPC","issued"],["Design-stage estimate","first cost reference"]],
  note:"The expert validates first — AI prepares, the architect decides"},
 s3:{cmp:"Like-for-like comparison · 3 builders",head:["","B1","B2","B3"],rows:[["Price","€102k","€99.4k","€108k"],["Timeline","6 months","5 months","5 months"],["Warranty","2 years","3 years","2 years"],["ITE repairs","included","included","partial"]],
  neg:"Selection assistance",negRows:["The comparison is built on the same validated project","RetroFin assists the community in negotiating terms","The final decision always belongs to the assembly"],
  note:"B2 recommended · best price–timeline–warranty balance"},
 s4:{ledg:"Per-household numbers · Usera 51 case",rows:[["Total cost of the retrofit","€99,400",""],["Covered by subsidies","€58,400",""],["Resulting community loan","€31,800",""],["Monthly instalment per household (during works)","−€85/mo",""],["Estimated energy savings (after works)","+€200/mo","pos"],["Net result per household","+€115/mo","pos"]],
  vote:"Two-step vote",voteQ:"On the ballot: works + builder + loan",voteRes:"Yes · 78%",voteNo:"No · 22%",
  thr:"Thresholds: simple majority for envelope & ITE works (with ≥30% public aid) · 1/3 for renewables & heat pumps (RDL 7/2026)",
  note:"Threshold reached ✓ · minutes generated automatically"},
 s5:{docs:"Dossier · each recipient gets only their part",checks:["✓ Assembly minutes.pdf","✓ Plan Rehabilita application.pdf","✓ Plan Estatal application.pdf","✓ Bank dossier — UCI (loan under the 50% MIVAU–ICO State guarantee)","○ CAE application — after savings verification"],
  cae:"CAE rebate",caeRows:[["Mechanism","verified savings → early loan repayment"],["Timeline (real case)","paid ~6–9 months after works start"],["Verification","accredited verifier (ENAC)"]],
  note:"Upload once, share selectively — the architect supervises the works"},
}};
let lang=(new URLSearchParams(location.search).get('lang')==='en')?'en':'es';
let step=1;
function setLang(l){lang=l;render();}
function go(d){ if(step===5&&d===1){step=1;} else {step=Math.max(1,Math.min(5,step+d));} render(); }
function card(title,inner){return `<div class="card"><h5>${title}</h5>${inner}</div>`;}
function rows(r){return r.map(([k,v,c])=>`<div class="row"><span class="k">${k}</span><span class="v ${c||''}">${v}</span></div>`).join('');}
function checks(c){return c.map(x=>`<div class="check ${x.startsWith('○')?'pend':''}">${x}</div>`).join('');}
function render(){
 const t=T[lang];
 document.documentElement.lang=lang;
 document.querySelector('[data-t=demoTag]').textContent=t.demoTag;
 document.getElementById('btn-es').className=lang==='es'?'on':'';
 document.getElementById('btn-en').className=lang==='en'?'on':'';
 document.getElementById('chips').innerHTML=t.chips.map((c,i)=>{
   const cls=(i+1)===step?'on':((i+1)<step?'done':'');
   return `<div class="chip ${cls}" onclick="step=${i+1};render()"><span class="n">${i+1}</span><span class="l">${c}</span></div>`;
 }).join('<div class="sep"></div>');
 document.getElementById('scrTitle').textContent=t.titles[step-1];
 document.getElementById('stepChip').textContent=t.stepOf(step);
 document.getElementById('progress').textContent=t.progress(step);
 document.getElementById('prev').textContent=t.prev;
 document.getElementById('prev').style.visibility=step===1?'hidden':'visible';
 document.getElementById('next').textContent=step===5?t.finish:t.next;
 document.getElementById('foot').innerHTML=t.foot;
 const b=document.getElementById('body');
 if(step===1){const s=t.s1;
  b.innerHTML=card(s.profile,rows(s.rows))
   +card(s.subs,`<div class="chiprow">${s.chips.map(c=>`<span class="tag ok">${c}</span>`).join('')}</div><h5 style="margin-top:16px">${s.ite}</h5><div class="chiprow">${s.iteRows.map(c=>`<span class="tag warn">${c}</span>`).join('')}</div>`)
   +`<div class="wide"><div class="note pulse">${s.note}</div></div>`;}
 if(step===2){const s=t.s2;
  b.innerHTML=card(s.pm,checks(s.checks))+card(s.out,rows(s.outRows))+`<div class="wide"><div class="note">${s.note}</div></div>`;}
 if(step===3){const s=t.s3;
  b.innerHTML=`<div class="card wide"><h5>${s.cmp}</h5><table><tr>${s.head.map((h,i)=>`<th class="${i===2?'hl':''}">${h}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===2?'hl':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`
   +card(s.neg,checks(s.negRows.map(x=>'✓ '+x)))+`<div class="card"><div class="note">${s.note}</div></div>`;}
 if(step===4){const s=t.s4;
  b.innerHTML=`<div class="card ledg"><h5>${s.ledg}</h5>${rows(s.rows)}</div>`
   +card(s.vote,`<div style="font-size:13px;margin-bottom:4px">${s.voteQ}</div><div class="votebar"><span id="vb"></span></div><div class="votelbl"><span>${s.voteRes}</span><span>${s.voteNo}</span></div><p class="small" style="margin-top:14px">${s.thr}</p>`)
   +`<div class="wide"><div class="note">${s.note}</div></div>`;
  setTimeout(()=>{const v=document.getElementById('vb'); if(v)v.style.width='78%';},80);}
 if(step===5){const s=t.s5;
  b.innerHTML=card(s.docs,checks(s.checks))+card(s.cae,rows(s.caeRows))+`<div class="wide"><div class="note">${s.note}</div></div>`;}
 window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
